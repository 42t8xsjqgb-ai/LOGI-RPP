<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERDIRFORMANCE LOGI-RPP V3</title>
    
    <!-- Script pour masquer les avertissements de développement liés au mode "sans serveur" (Babel et Tailwind) -->
    <script>
        const origWarn = console.warn;
        const origLog = console.log;
        console.warn = function(...args) {
            if (typeof args[0] === 'string' && (args[0].includes('cdn.tailwindcss.com') || args[0].includes('in-browser Babel'))) return;
            origWarn.apply(console, args);
        };
        console.log = function(...args) {
            if (typeof args[0] === 'string' && args[0].includes('in-browser Babel')) return;
            origLog.apply(console, args);
        };
    </script>

    <!-- Chargement des librairies indispensables (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Utilisation de cdnjs pour Babel afin d'éviter l'erreur 404 du fichier SourceMap (.map) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Configuration du design -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-blue': 'pulse-blue 2s infinite',
                        'fadeIn': 'fadeIn 0.3s ease-in-out',
                    },
                    keyframes: {
                        'pulse-blue': {
                            '0%': { boxShadow: '0 0 0 0 rgba(37, 99, 235, 0.6)' },
                            '70%': { boxShadow: '0 0 0 5px rgba(37, 99, 235, 0)' },
                            '100%': { boxShadow: '0 0 0 0 rgba(37, 99, 235, 0)' },
                        },
                        'fadeIn': {
                            'from': { opacity: '0', transform: 'translateY(5px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { size: A4 portrait; margin: 15mm; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans print:bg-white print:m-0">
    <!-- Point d'ancrage de l'application -->
    <div id="root">
        <div style="text-align: center; padding: 50px; font-family: sans-serif; color: #1e3a8a;">
            Chargement sécurisé de PERDIRFORMANCE LOGI-RPP V3...
        </div>
    </div>

    <!-- Code logique de l'application -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPOSANTS ICÔNES (SVG Intégrés) ---
        const IconSettings = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconCalendar = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconUsers = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const IconFileText = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconPrinter = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const IconBarChart3 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><rect x="7" y="14" width="4" height="5" rx="1"/><rect x="15" y="5" width="4" height="14" rx="1"/></svg>;
        const IconPlus = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconEdit2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
        const IconSave = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconChevronUp = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"></polyline></svg>;
        const IconChevronDown = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const IconListOrdered = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>;
        const IconHelp = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const IconCopy = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
        const IconFolder = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;

        function App() {
          const [activeTab, setActiveTab] = useState('config');
          const [isLoaded, setIsLoaded] = useState(false);
          
          // État pour gérer ce qui doit être imprimé (programme, émargement, ou tout masquer momentanément)
          const [printMode, setPrintMode] = useState('all');

          // --- ÉTAT GLOBAL ---
          const [schoolInfo, setSchoolInfo] = useState({
            name: '',
            cachet: '',
            logoImage: null,
            cachetImage: null
          });

          const [teachers, setTeachers] = useState([]);
          const [rooms, setRooms] = useState([]);
          const [classes, setClasses] = useState([]);

          // --- GESTION DES RENCONTRES (ARCHIVAGE ANNUEL) ---
          const [eventsList, setEventsList] = useState([
            {
              id: 1,
              title: 'Rencontre N°1 - Semestre 1',
              date: '',
              selectedClasses: [], 
              parts: [
                {
                  id: 1,
                  startTime: '16:30',
                  endTime: '17:00',
                  title: 'Bilan et Remise des bulletins',
                  description: "Le professeur principal, avec le concours de l'équipe pédagogique, présentera un bilan global de l'investissement et de l'attitude des élèves. À cette occasion, les bulletins seront remis aux familles.",
                  type: 'par_classe',
                  regroupementClasses: '',
                  regroupementRoom: ''
                },
                {
                  id: 2,
                  startTime: '17:00',
                  endTime: '19:30',
                  title: 'Rencontres individuelles par discipline',
                  description: "Les professeurs reçoivent les familles individuellement dans les salles dédiées par discipline.",
                  type: 'par_discipline',
                  regroupementClasses: '',
                  regroupementRoom: ''
                }
              ],
              classPlacements: [], 
              subjectRooms: [], 
              attendanceStats: [],
              excludedTeachers: [] // Remplacement de l'état global par un état propre à chaque événement
            }
          ]);
          const [currentEventId, setCurrentEventId] = useState(1);

          // L'événement actif dérivé de la liste
          const eventData = eventsList.find(e => e.id === currentEventId) || eventsList[0];
          
          // Fonction de mise à jour transparente pour le reste du code
          const setEventData = (newData) => {
            setEventsList(eventsList.map(e => e.id === currentEventId ? newData : e));
          };

          const [editingItem, setEditingItem] = useState(null);
          const [statsView, setStatsView] = useState('current'); // État pour basculer entre la vue ponctuelle et la vue cumulée

          // --- SAUVEGARDE AUTO ET IMPORT/EXPORT (BACKUP) ---
          useEffect(() => {
            try {
              // Migration automatique des données de l'ancienne orthographe vers la nouvelle
              const oldSavedData = localStorage.getItem('PERDIFORMANCE_RPP_DATA');
              if (oldSavedData && !localStorage.getItem('PERDIRFORMANCE_RPP_DATA')) {
                localStorage.setItem('PERDIRFORMANCE_RPP_DATA', oldSavedData);
                localStorage.removeItem('PERDIFORMANCE_RPP_DATA');
              }

              const savedData = localStorage.getItem('PERDIRFORMANCE_RPP_DATA');
              if (savedData) {
                const parsed = JSON.parse(savedData);
                if (parsed.schoolInfo) setSchoolInfo(parsed.schoolInfo);
                if (parsed.teachers) setTeachers(parsed.teachers);
                if (parsed.rooms) setRooms(parsed.rooms);
                if (parsed.classes) setClasses(parsed.classes);
                if (parsed.eventsList) setEventsList(parsed.eventsList);
                if (parsed.currentEventId) setCurrentEventId(parsed.currentEventId);
              }
            } catch (e) {
              console.error("Erreur lors du chargement des données", e);
            }
            setIsLoaded(true);
          }, []);

          useEffect(() => {
            if (!isLoaded) return;
            const dataToSave = { schoolInfo, teachers, rooms, classes, eventsList, currentEventId };
            try {
              localStorage.setItem('PERDIRFORMANCE_RPP_DATA', JSON.stringify(dataToSave));
            } catch (e) {
              if (e.name === 'QuotaExceededError') {
                console.warn("Quota dépassé, sauvegarde en cache sans les images...");
                const dataWithoutImages = { ...dataToSave, schoolInfo: { ...schoolInfo, logoImage: null, cachetImage: null } };
                localStorage.setItem('PERDIRFORMANCE_RPP_DATA', JSON.stringify(dataWithoutImages));
              }
            }
          }, [schoolInfo, teachers, rooms, classes, eventsList, currentEventId, isLoaded]);

          const handleResetAll = () => {
            if (window.confirm('⚠️ ATTENTION : Cela va effacer TOUTES vos données actuelles (classes, professeurs, salles, événements). Confirmez-vous ?')) {
              localStorage.removeItem('PERDIRFORMANCE_RPP_DATA');
              window.location.reload();
            }
          };

          const handleExportBackup = () => {
            const now = new Date();
            const jj = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const aaaa = now.getFullYear();
            const heure = `${String(now.getHours()).padStart(2, '0')}h${String(now.getMinutes()).padStart(2, '0')}`;
            const defaultName = `RPP_${jj}${mm}${aaaa}_${heure}`;
            let fileName = window.prompt("Nommez votre fichier de sauvegarde :", defaultName);
            if (fileName === null) return;
            if (fileName.trim() === '') fileName = defaultName;
            if (!fileName.toLowerCase().endsWith('.json')) fileName += '.json';

            const data = { schoolInfo, teachers, rooms, classes, eventsList, currentEventId };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            link.click();
          };

          const handleImportBackup = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const parsed = JSON.parse(event.target.result);
                if (parsed.schoolInfo) setSchoolInfo(parsed.schoolInfo);
                if (parsed.teachers) setTeachers(parsed.teachers);
                if (parsed.rooms) setRooms(parsed.rooms);
                if (parsed.classes) setClasses(parsed.classes);
                if (parsed.eventsList) setEventsList(parsed.eventsList);
                if (parsed.currentEventId) setCurrentEventId(parsed.currentEventId);
                alert('Sauvegarde restaurée avec succès !');
              } catch (err) {
                alert('Erreur : Fichier de sauvegarde non valide.');
              }
            };
            reader.readAsText(file);
            e.target.value = null;
          };

          // Liaison automatique Classes <-> PP
          useEffect(() => {
            if (teachers.length > 0 && classes.some(c => !c.ppId && c.ppNameTemp)) {
              setClasses(prev => {
                let changed = false;
                const next = prev.map(c => {
                  if (!c.ppId && c.ppNameTemp) {
                    const match = teachers.find(t => t.nom.toLowerCase() === c.ppNameTemp.toLowerCase() || c.ppNameTemp.toLowerCase().includes(t.nom.toLowerCase()));
                    if (match) {
                      changed = true;
                      return { ...c, ppId: match.id, ppNameTemp: '' };
                    }
                  }
                  return c;
                });
                return changed ? next : prev;
              });
            }
          }, [teachers]);

          // --- HELPERS ---
          const formatDateFR = (dateStr) => {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            if (year && month && day) return `${day}/${month}/${year}`;
            return dateStr;
          };

          const getTeacherName = (id) => {
            if (!id) return 'Non assigné';
            const t = teachers.find(t => t.id === id);
            return t ? `${t.civ} ${t.nom}`.trim() : 'Inconnu';
          };
          const getClassName = (id) => classes.find(c => c.id === id)?.name || 'Inconnue';
          const getRoomName = (id) => {
            if (!id) return 'À définir';
            const r = rooms.find(r => r.id === parseInt(id));
            return r ? r.name : 'À définir';
          };

          const getAllSelectedAccompIds = () => {
            const allIds = new Set();
            eventData.selectedClasses.forEach(cid => {
              const cls = classes.find(c => c.id === cid);
              if (cls && cls.ppId) allIds.add( parseInt(cls.ppId) );
            });
            eventData.classPlacements.forEach(p => {
              if (p.substitutePpId) allIds.add( parseInt(p.substitutePpId) );
              if (p.accompIds) {
                p.accompIds.forEach(id => allIds.add( parseInt(id) ));
              }
            });
            return Array.from(allIds);
          };

          const mapSubjectName = (rawName) => {
            if (!rawName) return '';
            let s = rawName.toUpperCase().trim();
            
            if (s.includes('L1000') || (s.includes('HIST') && s.includes('GEO'))) return 'Histoire-Géographie';
            if (s.includes('L1300') || s.includes('MATH')) return 'Mathématiques';
            if (s.includes('L0202') || s.includes('LETTRES MOD') || s.includes('FRANCAIS')) return 'Français';
            if (s.includes('L0201') || s.includes('LETTRES CLAS')) return 'Lettres Classiques';
            if (s.includes('L0422') || s.includes('ANGLAIS')) return 'Anglais';
            if (s.includes('L0426') || s.includes('ESPAGNOL')) return 'Espagnol';
            if (s.includes('L0421') || s.includes('ALLEMAND')) return 'Allemand';
            if (s.includes('L0429') || s.includes('ITALIEN')) return 'Italien';
            if (s.includes('L1500') || (s.includes('PHYS') && s.includes('CHIM'))) return 'Physique-Chimie';
            if (s.includes('L1600') || s.includes('SVT') || (s.includes('VIE') && s.includes('TERRE'))) return 'SVT';
            if (s.includes('L1400') || s.includes('TECHNO')) return 'Technologie';
            if (s.includes('L1700') || s.includes('EDU MU') || s.includes('ED. MUS') || s.includes('MUSIQUE')) return 'Éducation Musicale';
            if (s.includes('L1800') || s.includes('ARTS PLAST') || s.includes('ART PLA')) return 'Arts Plastiques';
            if (s.includes('L1900') || s.includes('EPS') || s.includes('SPORT')) return 'EPS';
            if (s.includes('L3000') || s.includes('DOC')) return 'Documentation';
            if (s.includes('ULIS')) return 'ULIS';
            if (s.includes('SEGPA')) return 'SEGPA';
            
            s = s.replace(/^[A-Z]\d{4}\s*/, '');
            
            if (s.length > 0) return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
            return rawName;
          };

          // --- IMPRESSION INTELLIGENTE ---
          const handlePrint = (mode) => {
            setPrintMode(mode);
            setTimeout(() => {
              window.print();
              setPrintMode('all');
            }, 100);
          };

          // --- CRUD HANDLERS ---
          const handleAddClass = () => {
            const newId = Date.now();
            setClasses([{ id: newId, name: 'Nouvelle Classe', effectif: 0, ppId: '', ppNameTemp: '' }, ...classes]);
            setEditingItem({ type: 'class', id: newId });
          };

          const updateClass = (id, field, value) => {
            setClasses(classes.map(c => c.id === id ? { ...c, [field]: value } : c));
          };

          const handleAddTeacher = () => {
            const newId = Date.now();
            setTeachers([{ id: newId, civ: '', nom: 'NOUVEAU', prenom: '', discipline: '', name: 'NOUVEAU' }, ...teachers]);
            setEditingItem({ type: 'teacher', id: newId });
          };

          const updateTeacher = (id, field, value) => {
            setTeachers(teachers.map(t => {
              if (t.id === id) {
                const updated = { ...t, [field]: value };
                if (field === 'discipline') updated.discipline = mapSubjectName(value);
                updated.name = `${updated.civ} ${updated.nom} ${updated.prenom}`.trim();
                return updated;
              }
              return t;
            }));
          };

          const handleAddRoom = () => {
            const newId = Date.now();
            setRooms([{ id: newId, name: 'Nouvelle Salle' }, ...rooms]);
            setEditingItem({ type: 'room', id: newId });
          };

          // --- IMPORT LOGIC (CSV & EXCEL) ---
          const handleImportFile = (event, type) => {
            const file = event.target.files[0];
            if (!file) return;

            const processText = (text) => {
              const lines = text.split('\n').filter(line => line.trim() !== '');
              
              if (type === 'teachers') {
                const newTeachers = [];
                lines.forEach((line, idx) => {
                  // Nettoyage de la ligne (retrait des guillemets et retours chariot d'Excel)
                  let cleanLine = line.replace(/[\r"]/g, '').trim();
                  if (!cleanLine) return;

                  // Détection intelligente du séparateur (Tabulation, Point-virgule, ou Virgule)
                  let cols = cleanLine.split(/\t|;/);
                  if (cols.length === 1 && cleanLine.includes(',')) {
                    cols = cleanLine.split(',');
                  }
                  
                  cols = cols.map(c => c.trim()).filter(c => c !== '');
                  if (cols.length === 0) return;

                  // Ignorer intelligemment la ligne d'en-tête, peu importe comment elle s'appelle
                  const firstCol = cols[0].toLowerCase();
                  if (idx === 0 && (firstCol === 'civ' || firstCol.includes('civilité') || firstCol === 'nom' || firstCol.includes('professeur'))) {
                    return; 
                  }

                  let civ = '', nom = '', prenom = '', rawDiscipline = '';

                  // Heuristique d'extraction "Forcée" : on s'adapte au nombre de colonnes trouvées
                  if (cols.length >= 4) {
                    civ = cols[0];
                    nom = cols[1];
                    prenom = cols[2];
                    rawDiscipline = cols[cols.length - 1]; // On suppose que la discipline est toujours à la fin
                  } else if (cols.length === 3) {
                    nom = cols[0];
                    prenom = cols[1];
                    rawDiscipline = cols[2];
                  } else if (cols.length === 2) {
                    nom = cols[0];
                    rawDiscipline = cols[1];
                  } else {
                    nom = cols[0];
                  }

                  const discipline = mapSubjectName(rawDiscipline);
                  const name = `${civ} ${nom} ${prenom}`.replace(/\s+/g, ' ').trim();
                  
                  // On enregistre de force si un nom a été trouvé et qu'il ne s'agit pas d'un reliquat d'en-tête

                        id: Date.now() + idx, 
                        civ, 
                        nom: nom.toUpperCase(), 
                        prenom, 
                        discipline, 
                        name 
                    });
                  }
                });
                
                setTeachers(prev => [...prev, ...newTeachers]);

                    ppNameTemp: cols[2]?.trim() || ''

                </div>

                {/* DOCUMENT 2 : EMARGEMENT */}
                <div className={`bg-white p-10 shadow-lg print:shadow-none print:p-0 ${printMode === 'program' ? 'hidden print:hidden' : 'block'}`} style={{fontFamily: 'Arial, sans-serif'}}>
                  {/* En-tête indépendant pour l'émargement */}
                  <div className="flex items-center justify-start mb-6 gap-8">
                    {schoolInfo.logoImage && <img src={schoolInfo.logoImage} alt="Logo" className="h-24 max-w-xs object-contain" />}
                    <span className="text-xl font-bold text-black uppercase tracking-wide">{schoolInfo.name}</span>
                  </div>
                  
                  <h1 className="text-2xl font-bold text-center mb-4 uppercase tracking-wide">LISTE D'ÉMARGEMENT</h1>
                  <h2 className="text-lg text-center mb-8">{eventData.title} {eventData.date && `- Date : ${formatDateFR(eventData.date)}`}</h2>
                  
                  <table className="w-full text-sm border-collapse border border-gray-400">
                    <thead>
                      <tr className="bg-gray-100">
                        <th className="border border-gray-400 p-2 w-1/2 text-left">NOM DU PROFESSEUR</th>
                        <th className="border border-gray-400 p-2 w-1/2 text-center">SIGNATURE (PRÉSENCE)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {teachers.filter(t => !(eventData.excludedTeachers || []).includes(t.id)).sort((a, b) => (a.nom || '').localeCompare(b.nom || '')).map((t) => (
                        <tr key={t.id}>
                          <td className="border border-gray-400 p-3 font-semibold">{t.name}</td>
                          <td className="border border-gray-400 p-3"></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

              </div>
            </div>
          );

          const renderPochettesTab = () => {
            const subjectRooms = eventData.subjectRooms || [];
            
            // Récupération automatique de l'horaire pour la phase 'par_discipline'
            const disciplinePart = eventData.parts.find(p => p.type === 'par_discipline');
            const formatTimeStr = (t) => t ? t.replace(':', 'h') : '';
            const timeDisplay = disciplinePart && disciplinePart.startTime && disciplinePart.endTime
              ? `De ${formatTimeStr(disciplinePart.startTime)} à ${formatTimeStr(disciplinePart.endTime)}`
              : '';

            return (
              <div className="space-y-6">
                <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm print:hidden">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">Affiches pour portes de salles (Rencontre par Discipline)</h2>
                    <p className="text-sm text-gray-500">Aperçu en format A4 réel. Visualisez exactement ce qui sortira de l'imprimante.</p>
                  </div>
                  <button onClick={() => window.print()} className="flex items-center bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm font-bold">
                    <IconPrinter className="w-5 h-5 mr-2"/> Imprimer les affiches
                  </button>
                </div>

                {subjectRooms.length === 0 && (
                  <div className="bg-white p-12 rounded-xl shadow-sm border border-gray-100 text-center print:hidden">
                    <IconFolder className="w-12 h-12 text-gray-300 mx-auto mb-4" />
                    <p className="text-gray-500 text-lg">Aucune répartition par discipline n'a été configurée pour cet événement.</p>
                    <button onClick={() => setActiveTab('event')} className="mt-4 text-blue-600 hover:underline font-semibold">Aller dans "L'Événement" pour configurer la grille</button>
                  </div>
                )}

                {/* Conteneur gris simulant un bureau pour les feuilles A4 */}
                <div className="bg-slate-200 p-8 rounded-xl overflow-x-auto print:bg-transparent print:p-0 print:overflow-visible">
                  <div className="flex flex-col space-y-12 print:space-y-0 items-center print:items-stretch">
                    
                    {subjectRooms.map((sr, idx) => {
                      // Algorithme d'adaptation intelligente de la taille du texte de la salle
                      const roomName = getRoomName(sr.roomId);
                      let roomSizeClass = "text-[6rem] md:text-[7rem]"; // Très court (ex: D15)
                      if (roomName.length > 18) roomSizeClass = "text-[2rem] md:text-[2.5rem]"; // Extrêmement long
                      else if (roomName.length > 13) roomSizeClass = "text-[2.5rem] md:text-[3.5rem]"; // Long (ex: SALLE ETUDE 1)
                      else if (roomName.length > 8) roomSizeClass = "text-[3.5rem] md:text-[4.5rem]"; // Moyen (ex: B02 Labo)
                      else if (roomName.length > 4) roomSizeClass = "text-[4.5rem] md:text-[5.5rem]"; // Court (ex: D04 S.)

                      return (
                      /* Simulation exacte d'une feuille A4 (210x297mm) */
                      <div key={sr.id || idx} 
                           className="bg-white shadow-2xl flex flex-col relative overflow-hidden print:shadow-none print:border-none border border-gray-300 shrink-0" 
                           style={{ width: '210mm', height: '297mm', pageBreakAfter: 'always', pageBreakInside: 'avoid' }}>
                        
                        {/* En-tête institutionnel repensé : Logo seul en haut à gauche */}
                        <div className="w-full px-12 pt-10 opacity-90 shrink-0">
                          {schoolInfo.logoImage && <img src={schoolInfo.logoImage} alt="Logo" className="h-32 max-w-full object-contain" />}
                        </div>

                        {/* Contenu central de l'affiche */}
                        <div className="flex-1 flex flex-col items-center justify-start pt-4 pb-8">
                          
                          {/* Titres centrés au-dessus de la salle, pleine largeur, SANS rognage */}
                          <div className="w-full text-center px-12 mb-10">
                            <div className="font-black text-3xl md:text-[2.2rem] uppercase text-slate-900 leading-tight">
                              {schoolInfo.name}
                            </div>
                            <div className="font-bold text-2xl text-slate-700 mt-3 leading-snug">
                              {eventData.title} {eventData.date && `- ${formatDateFR(eventData.date)}`}
                            </div>
                          </div>

                          <div className="text-gray-500 uppercase tracking-widest font-bold mb-2 text-2xl">Salle</div>
                          <div className={`${roomSizeClass} w-full px-8 font-black text-slate-900 mb-6 uppercase tracking-wider leading-none text-center break-words`}>
                            {roomName}
                          </div>
                          
                          {timeDisplay && (
                            <div className="text-2xl font-bold text-indigo-800 bg-indigo-50 border border-indigo-100 px-8 py-3 rounded-full mb-10 shadow-sm">
                              ⏱️ {timeDisplay}
                            </div>
                          )}
                          
                          <div className="w-1/2 h-2 bg-indigo-600 mx-auto mb-10 rounded-full shrink-0"></div>
                          
                          <div className="text-[3.5rem] font-extrabold text-indigo-900 mb-10 uppercase text-center leading-tight px-8">
                            {sr.subject}
                          </div>
                          
                          {/* Grille flex-wrap pour éviter le débordement vertical */}
                          <div className="flex flex-wrap justify-center gap-4 w-full px-12">
                            {(sr.teacherIds || []).map(id => (
                              <div key={id} className="bg-slate-50 px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-2xl font-medium text-slate-700">
                                {getTeacherName(id)}
                              </div>
                            ))}
                            {(!sr.teacherIds || sr.teacherIds.length === 0) && <div className="italic text-gray-400 border border-dashed border-gray-300 p-4 rounded-xl text-xl">Aucun professeur assigné</div>}
                          </div>
                        </div>

                      </div>
                    );
                    })}
                  </div>
                </div>
              </div>
            );
          };

          const renderGuideTab = () => (
            <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 animate-fadeIn max-w-4xl mx-auto print:hidden">
              <h2 className="text-2xl font-bold text-blue-900 mb-6 flex items-center border-b pb-4">
                <IconHelp className="w-8 h-8 mr-3 text-blue-600"/> 
                Guide d'Utilisation : PERDIRFORMANCE LOGI-RPP
              </h2>
              
              <div className="space-y-8 text-slate-700">
                {/* Intro */}
                <section className="bg-blue-50 p-5 rounded-lg border border-blue-100">
                  <h3 className="font-bold text-blue-800 mb-2 flex items-center text-lg">🛡️ Conformité RGPD & Sécurité</h3>
                  <p className="text-sm leading-relaxed">
                    <strong>100% Local :</strong> Ce progiciel fonctionne entièrement dans votre navigateur web. Aucune donnée (noms des élèves, personnels, statistiques) ne transite sur internet. Tout reste stocké sur la machine locale de l'utilisateur, garantissant une conformité absolue aux exigences RGPD de l'Éducation Nationale.
                  </p>
                </section>

                <section>
                  <h3 className="font-bold text-lg text-slate-800 border-b border-gray-200 pb-2 mb-3">💾 1. Gestion des Sauvegardes</h3>
                  <p className="text-sm leading-relaxed mb-2">Bien que le logiciel mémorise vos actions, il est <strong>impératif d'effectuer des sauvegardes régulières</strong> (barre supérieure à droite).</p>
                  <ul className="list-disc pl-5 text-sm space-y-1 text-gray-600">
                    <li><strong>Sauvegarder :</strong> Exporte vos données dans un fichier <code>.json</code>. Vous pouvez le nommer librement (ex: <i>RPP_Trimestre1</i>).</li>
                    <li><strong>Importer :</strong> Permet de recharger un fichier précédemment sauvegardé.</li>
                    <li><strong>Réinitialiser :</strong> Efface toutes les données pour repartir d'une feuille vierge.</li>
                  </ul>
                </section>

                <section>
                  <h3 className="font-bold text-lg text-slate-800 border-b border-gray-200 pb-2 mb-3">⚙️ 2. Onglet "Configuration"</h3>
                  <p className="text-sm leading-relaxed mb-3">C'est ici que vous importez les bases de données de votre EPLE. Utilisez le bouton <span className="inline-block px-2 py-0.5 bg-blue-600 text-white rounded text-xs font-bold mx-1">📥 Importer</span> pour charger vos fichiers CSV ou Excel.</p>
                  <ul className="list-disc pl-5 text-sm space-y-2 text-gray-600">
                    <li><strong>Classes :</strong> Format attendu : <i>Classe; Effectif; Nom du PP</i>.</li>
                    <li>
                      <strong>Professeurs :</strong> <br/>
                      <span className="inline-block mt-1 p-2 bg-indigo-50 border border-indigo-100 rounded text-indigo-800">
                        <strong>✨ Import "Tout-Terrain" :</strong> Le logiciel s'adapte à vos fichiers bruts (STS Web, SIÈCLE, Pronote). Il détecte automatiquement les colonnes, ignore les en-têtes et nettoie les codes matières techniques (ex: <i>L1000 HIST. GEO.</i> devient <i>Histoire-Géographie</i>).
                      </span>
                    </li>
                    <li><strong>Salles :</strong> Format attendu : <i>Nom de la salle</i>.</li>
                  </ul>
                </section>

                <section>
                  <h3 className="font-bold text-lg text-slate-800 border-b border-gray-200 pb-2 mb-3">📅 3. Onglet "L'Événement"</h3>
                  <p className="text-sm leading-relaxed mb-2">Construisez ici le scénario de votre rencontre. Les dates s'affichent et s'impriment exactement telles que saisies.</p>
                  <ul className="list-disc pl-5 text-sm space-y-2 text-gray-600">
                    <li><strong>Duplication 📑 :</strong> Utilisez l'icône de "copie" pour dupliquer une rencontre (ex: passage au Semestre 2). L'ossature est conservée, mais les salles, accompagnateurs et statistiques sont libérés pour le nouvel événement.</li>
                    <li><strong>Grille par Classe :</strong> Affectez les salles. Utilisez le bouton <i>🪄 Trier auto.</i> pour ranger instantanément les classes par niveau (6ème avant 5ème) ou les flèches pour un tri manuel.</li>
                    <li><strong>Grille par Discipline :</strong> Cliquez sur <i>🪄 Générer auto.</i> pour regrouper les professeurs avec un tri académique standardisé (Sciences, Lettres, Langues...).</li>
                    <li><span className="text-red-600 font-medium">⚠️ Sécurité Anti-Doublon :</span> Dès qu'une salle est affectée, elle devient grisée et marquée "(Occupée)" dans les autres listes.</li>
                  </ul>
                </section>

                <section>
                  <h3 className="font-bold text-lg text-slate-800 border-b border-gray-200 pb-2 mb-3">👥 4. Émargement & 📊 5. Statistiques</h3>
                  <ul className="list-disc pl-5 text-sm space-y-2 text-gray-600">
                    <li><strong>Émargement :</strong> Décochez les professeurs absents. <i>Vos choix sont sauvegardés individuellement pour chaque rencontre.</i></li>
                    <li><strong>Statistiques & Bilan Cumulé :</strong> Saisissez le nombre de parents présents (pourcentages et couleurs dynamiques). Nouveauté : Utilisez le sélecteur d'affichage pour consulter le <strong>Bilan global cumulé</strong>, qui agrège automatiquement la participation sur l'année complète (idéal pour la présentation en CA).</li>
                  </ul>
                </section>

                <section>
                  <h3 className="font-bold text-lg text-slate-800 border-b border-gray-200 pb-2 mb-3">🖨️ 6. Impressions (Aperçu, Émargement, Pochettes)</h3>
                  <p className="text-sm leading-relaxed mb-3">
                    Le logiciel met en page automatiquement vos saisies sous la forme de documents institutionnels PDF.
                  </p>
                  <ul className="list-disc pl-5 text-sm space-y-2 text-gray-600">
                    <li><strong>Aperçu & Impression :</strong> Génère le programme global de la soirée et la feuille d'émargement officielle avec votre logo.</li>
                    <li><strong>Pochettes Salles :</strong> Génère de très grandes affiches (1 par page A4) avec le nom de la salle, la matière, les professeurs, et l'intégration <strong>automatique de l'horaire</strong>. Un format anti-débordement garantit une impression parfaite !</li>
                  </ul>
                </section>

              </div>
            </div>
          );

          const tabs = [
            { id: 'config', label: 'Configuration', icon: IconSettings },
            { id: 'event', label: 'L\'Événement', icon: IconCalendar },
            { id: 'emargement', label: 'Émargement', icon: IconUsers },
            { id: 'stats', label: 'Statistiques', icon: IconBarChart3 },
            { id: 'print', label: 'Aperçu & Impression', icon: IconFileText },
            { id: 'pochettes', label: 'Pochettes Salles', icon: IconFolder },
            { id: 'guide', label: 'Guide', icon: IconHelp }
          ];

          return (
            <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans print:bg-white print:m-0">
              {/* HEADER / NAVIGATION */}
              <header className="bg-blue-900 text-white shadow-md print:hidden sticky top-0 z-20">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex flex-col sm:flex-row justify-between sm:h-16 items-center py-3 sm:py-0 gap-3">
                    <div className="flex items-center">
                      <span className="font-bold text-2xl tracking-tight">PERDIRFORMANCE <span className="text-blue-200 font-light text-xl">LOGI-RPP V3</span></span>
                    </div>
                    <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                      <button onClick={handleResetAll} className="text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded flex items-center transition-colors shadow-sm whitespace-nowrap border border-red-500/50">
                        🔄 Réinitialiser
                      </button>
                      <label className="animate-pulse-blue text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded flex items-center transition-colors cursor-pointer shadow-sm border border-blue-500/50 whitespace-nowrap">
                        📥 Importer
                        <input type="file" accept=".json" className="hidden" onChange={handleImportBackup} />
                      </label>
                      <button onClick={handleExportBackup} className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded flex items-center transition-colors shadow-sm border border-blue-500/50 whitespace-nowrap">
                        💾 Sauvegarder
                      </button>
                    </div>
                  </div>
                  <nav className="flex space-x-1 overflow-x-auto pb-2 mt-2">
                    {tabs.map(tab => {
                      const Icon = tab.icon;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`flex items-center px-5 py-2.5 text-base font-semibold rounded-t-lg transition-colors whitespace-nowrap ${
                            activeTab === tab.id 
                              ? 'bg-slate-50 text-blue-700 shadow-sm' 
                              : 'text-blue-100 hover:text-white hover:bg-white/10'
                          }`}
                        >
                          <Icon className="w-5 h-5 mr-2" />
                          {tab.label}
                        </button>
                      )
                    })}
                  </nav>
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 print:p-0 print:max-w-none">
                {activeTab === 'config' && renderConfigTab()}
                {activeTab === 'event' && renderEventTab()}
                {activeTab === 'emargement' && renderEmargementTab()}
                {activeTab === 'stats' && renderStatsTab()}
                {activeTab === 'print' && renderPrintTab()}
                {activeTab === 'pochettes' && renderPochettesTab()}
                {activeTab === 'guide' && renderGuideTab()}
              </main>

              {/* FOOTER LOGICIEL (Visible uniquement à l'écran) */}
              <footer className="bg-slate-100 border-t border-slate-200 py-4 text-center print:hidden mt-auto">
                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">
                  Proposé par Yannis CHRISTON <span className="mx-2 text-slate-300">|</span> Fonctionnement en local RGPD
                </p>
              </footer>
            </div>
          );
        }

        // Rendu final React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
